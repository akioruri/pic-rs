[package]
name = "pic-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
reqwest = { version = "0.12", features = ["json", "blocking"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
dirs = "5"
serde_json = "1"
aws-sigv4 = { version = "1", features = ["sign-http"] }
aws-credential-types = "1"
http = "1"
